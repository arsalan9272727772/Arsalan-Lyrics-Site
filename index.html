<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Account Recovery</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:#050505;
      color:#00ff88;
      font-family:monospace;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }
    .box{
      width:100%;
      max-width:430px;
      border:1px solid #00ff88;
      padding:25px;
      background:#090d0b;
      box-shadow:0 0 25px #00ff8833;
      text-align:center;
    }
    h1{
      color:#ff315c;
      font-size:25px;
      margin-bottom:8px;
    }
    .tag{
      color:#00ff88;
      margin-bottom:25px;
    }
    input{
      width:100%;
      padding:14px;
      background:#000;
      color:#00ff88;
      border:1px solid #00ff88;
      outline:none;
      margin-bottom:15px;
      font-family:monospace;
    }
    button{
      width:100%;
      padding:14px;
      background:#00ff88;
      color:#000;
      border:0;
      font-weight:bold;
      cursor:pointer;
    }
    #status{
      margin-top:20px;
      min-height:50px;
      color:#00ff88;
      line-height:1.6;
    }
    .small{
      margin-top:20px;
      font-size:11px;
      color:#777;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>INSTAGRAM ACCOUNT RECOVERY</h1>
    <div class="tag">⚡ ARSALAN CYBER SECURITY ⚡</div>

    <input id="username" type="text"
      placeholder="Enter your username">

    <button onclick="recover()">VERIFY ACCOUNT</button>

    <div id="status"></div>

    <div class="small">
      Account recovery interface • Do not enter passwords or private credentials
    </div>
  </div>

  <script>
    function recover(){
      const user = document.getElementById("username").value.trim();
      const status = document.getElementById("status");

      if(!user){
        status.textContent = "[!] Enter a username first.";
        return;
      }

      status.innerHTML =
        "[+] USER: @" + user +
        "<br>[+] VERIFYING ACCOUNT...<br>" +
        "[+] RECOVERY PROCESS STARTED...";
    }
  </script>
</body>
</html>
